<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เกมฝึกพิมพ์นิทานอีสป</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--sf:#fff;--ink:#1d2733;--mute:#7b8896;--ok:#16813f;--bad:#d62f3a;--ac:#2457c5;--ln:#d5dde6;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a22;--sf:#1e2733;--ink:#e8edf3;--mute:#8d9aa9;--ok:#4cd07f;--bad:#ff6b73;--ac:#7aa2ff;--ln:#324052;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a22;--sf:#1e2733;--ink:#e8edf3;--mute:#8d9aa9;--ok:#4cd07f;--bad:#ff6b73;--ac:#7aa2ff;--ln:#324052;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.9 Sarabun,"Noto Sans Thai",Tahoma,sans-serif}
main{max-width:1280px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;margin:0 0 4px}h2{font-size:21px;margin:0 0 10px}
p.sub{color:var(--mute);margin:0 0 18px;font-size:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
button{font:inherit;cursor:pointer;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:8px;padding:8px 14px}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button:disabled{opacity:.4;cursor:not-allowed}
.st{text-align:left;line-height:1.4;padding:12px}.st small{display:block;color:var(--mute)}
.st.done{border-color:var(--ok)}.st.done small{color:var(--ok)}
.bar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:600;margin-bottom:10px}
.meter{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin-bottom:14px}
.meter i{display:block;height:100%;background:var(--ac);width:100%;transition:width .5s linear}
.meter.low i{background:var(--bad)}
#txt{position:relative;font-size:26px;line-height:2.1;word-break:break-word;cursor:text;max-height:calc(100vh - 220px);min-height:220px;overflow-y:auto;overscroll-behavior:contain}
#txt span{color:var(--mute)}#txt .g{color:var(--ok)}#txt .r{color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,transparent);border-radius:3px}
#txt .c{border-bottom:3px solid var(--ac)}
#ta{position:fixed;top:0;left:0;opacity:0;width:1px;height:1px}
.wrap{display:grid;grid-template-columns:1fr 210px;gap:14px;align-items:start}
.side{position:sticky;top:12px;text-align:center;margin-bottom:16px}
.side small{display:block;color:var(--mute);font-size:15px;line-height:1.4}
#nx1{font-size:68px;line-height:1.5;font-weight:700;color:var(--ac);min-height:100px;display:flex;align-items:center;justify-content:center}
#nx1.sp{font-size:22px}
.side.err #nx1{color:var(--bad)}
#nx2{font-size:20px;color:var(--mute);letter-spacing:2px;word-break:break-all}
@media (max-width:560px){.wrap{grid-template-columns:1fr}.side{order:-1;position:static}#nx1{font-size:48px;min-height:70px}}
.q{margin-bottom:16px}.opt{display:block;width:100%;text-align:left;margin-top:6px}
.opt.sel{border-color:var(--ac);box-shadow:inset 0 0 0 1px var(--ac)}
.big{font-size:22px;font-weight:700}.ok{color:var(--ok)}.bad{color:var(--bad)}
label{font-size:16px}select{font:inherit;background:var(--sf);color:var(--ink);border:1px solid var(--ln);border-radius:6px;padding:4px 8px}

/* candy theme */
:root{--c:#ff5d9e;--g1:#ffe0ef;--g2:#dff3ff;--g3:#fff1c2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#3a1a46;--g2:#1a2547;--g3:#2d2340}}
:root[data-theme="dark"]{--g1:#3a1a46;--g2:#1a2547;--g3:#2d2340}
body{background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3)) fixed}
h1{background:linear-gradient(90deg,#ff5d9e,#ff8a1f,#5fc43a,#2fa8e8,#8b6cff);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;font-weight:800}
.card{border:3px solid var(--c);border-radius:20px;box-shadow:0 5px 0 var(--c)}
button{border-radius:999px;border:2px solid var(--ln);box-shadow:0 3px 0 var(--ln);font-weight:600}
button:active:not(:disabled){transform:translateY(2px);box-shadow:none}
button.p{background:linear-gradient(135deg,#ff5d9e,#8b6cff);border-color:#d44fb0;box-shadow:0 4px 0 #a63c8c;color:#fff}
.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.st{display:flex;align-items:center;gap:12px;font-weight:700;min-height:88px;border:3px solid var(--c);border-radius:24px;background:color-mix(in srgb,var(--c) 20%,var(--sf));box-shadow:0 5px 0 var(--c);transition:transform .15s}
.st:hover:not(:disabled){transform:translateY(-3px)}
.st:disabled{filter:grayscale(.9);opacity:.55}
.st.done{background:color-mix(in srgb,var(--c) 34%,var(--sf))}
.nb{flex:none;width:42px;height:42px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:19px;text-shadow:0 1px 1px rgba(0,0,0,.35);box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.35)}
.meter{height:16px;border-radius:999px;border:2px solid var(--c)}
.meter i{background:repeating-linear-gradient(45deg,var(--c) 0 12px,color-mix(in srgb,var(--c) 65%,#fff) 12px 24px)}
.opt.sel{border-color:var(--c);box-shadow:0 3px 0 var(--c)}
</style>
</head>

<main id="app"></main>
<script>
const S=[
{t:"กระต่ายกับเต่า",x:"กาลครั้งหนึ่งนานมาแล้ว ในป่าใหญ่แห่งหนึ่งมีกระต่ายตัวหนึ่งที่ชอบอวดว่าตนวิ่งเร็วที่สุดในป่า วันหนึ่งมันเห็นเต่าเดินช้าอยู่ริมทาง จึงหัวเราะเยาะว่า เจ้าเดินช้าอย่างนี้ คงไม่มีวันไปถึงไหน เต่าได้ยินจึงตอบอย่างใจเย็นว่า ข้าอาจช้า แต่ข้าไม่เคยหยุดเดิน เรามาแข่งกันไหม กระต่ายหัวเราะลั่น แล้วตกลงทันที เมื่อสัญญาณดังขึ้น กระต่ายพุ่งตัวออกไปอย่างรวดเร็ว ส่วนเต่าค่อยๆ ก้าวไปทีละก้าว เมื่อกระต่ายวิ่งมาไกลมาก มันหันกลับไปมองก็ไม่เห็นเต่า จึงคิดว่าตนมีเวลาเหลือเฟือ มันนอนลงใต้ต้นไม้ใหญ่และหลับไปอย่างสบายใจ ฝ่ายเต่าเดินต่อไปไม่หยุดพัก จนผ่านกระต่ายที่กำลังหลับอยู่ เมื่อกระต่ายตื่นขึ้นมา ก็เห็นว่าเต่าเกือบถึงเส้นชัยแล้ว มันรีบวิ่งสุดกำลัง แต่ก็สายเกินไป เต่าเข้าเส้นชัยก่อน กระต่ายจึงได้เรียนรู้ว่า ความขยันและความอดทนชนะความประมาทเสมอ",
q:[["ใครเป็นผู้ชอบอวดว่าวิ่งเร็วที่สุด",["เต่า","กระต่าย","สิงโต"],1],["ระหว่างการแข่ง กระต่ายทำอะไร",["นอนหลับใต้ต้นไม้","ว่ายน้ำ","กินอาหาร"],0],["ใครเข้าเส้นชัยก่อน",["กระต่าย","ไม่มีใครถึง","เต่า"],2],["เรื่องนี้สอนให้รู้ว่าอะไร",["ความอดทนชนะความประมาท","คนเร็วย่อมชนะเสมอ","ควรพักผ่อนให้มาก"],0]]},
{t:"สิงโตกับหนู",x:"วันหนึ่งสิงโตตัวใหญ่นอนหลับอยู่ใต้ร่มไม้ในป่า หนูตัวเล็กๆ ตัวหนึ่งวิ่งเล่นไปมา แล้วพลาดวิ่งข้ามตัวสิงโตโดยไม่ตั้งใจ สิงโตตื่นขึ้นด้วยความโกรธ มันจับหนูไว้ด้วยกรงเล็บและขู่ว่าจะกินเสีย หนูตัวสั่นด้วยความกลัว จึงร้องขอชีวิตว่า ได้โปรดปล่อยข้าไปเถิด ข้าไม่ได้ตั้งใจ ถ้าท่านไว้ชีวิตข้า สักวันข้าจะตอบแทนบุญคุณ สิงโตหัวเราะดังลั่น เพราะไม่เชื่อว่าหนูตัวเล็กจะช่วยตนได้ แต่มันก็สงสารและปล่อยหนูไป ต่อมาไม่นาน สิงโตติดอยู่ในตาข่ายของนายพราน มันคำรามสุดเสียงแต่ก็ดิ้นไม่หลุด หนูได้ยินเสียงจึงรีบวิ่งมา แล้วใช้ฟันแทะเชือกตาข่ายจนขาด สิงโตเป็นอิสระ หนูจึงพูดว่า ท่านเห็นไหม แม้ตัวเล็กอย่างข้าก็ช่วยท่านได้ สิงโตจึงรู้ว่าความเมตตาไม่เคยสูญเปล่า",
q:[["ใครวิ่งข้ามตัวสิงโตขณะที่นอนหลับ",["กระต่าย","หนู","นายพราน"],1],["สิงโตทำอย่างไรกับหนูในตอนแรก",["ปล่อยหนูไป","จับไว้และขู่ว่าจะกิน","ให้อาหารหนู"],1],["สิงโตติดอยู่ในอะไร",["ตาข่ายของนายพราน","หลุมลึก","ถ้ำ"],0],["เรื่องนี้สอนให้รู้ว่าอะไร",["ผู้ใหญ่ย่อมแข็งแรงกว่า","ความเมตตาไม่สูญเปล่า","ไม่ควรเชื่อใคร"],1]]},
{t:"อีกากับเหยือกน้ำ",x:"ในฤดูร้อนที่แห้งแล้ง อีกาตัวหนึ่งบินหาน้ำดื่มมาเป็นเวลานาน มันเหนื่อยและกระหายน้ำมาก จนแทบจะบินต่อไปไม่ไหว ทันใดนั้นมันเห็นเหยือกใบหนึ่งวางอยู่ใต้ต้นไม้ อีกาดีใจรีบบินลงไปดู แต่เมื่อมองเข้าไปในเหยือก ก็พบว่ามีน้ำอยู่เพียงนิดเดียว ปากของมันเอื้อมไปไม่ถึง อีการู้สึกท้อใจ ลองเอียงเหยือกก็ไม่มีแรงพอ มันนั่งคิดอยู่ครู่หนึ่ง แล้วก็เกิดความคิดดีๆ ขึ้นมา มันเห็นก้อนกรวดเล็กๆ กองอยู่ใกล้ๆ จึงคาบก้อนกรวดทีละก้อนมาหย่อนลงในเหยือก ก้อนกรวดจมลงไปและดันให้น้ำค่อยๆ สูงขึ้น อีกาทำอย่างนี้ซ้ำแล้วซ้ำอีกด้วยความอดทน จนในที่สุดน้ำก็สูงถึงปากเหยือก อีกาจึงได้ดื่มน้ำจนหายกระหาย และรู้ว่าปัญญากับความพยายามช่วยแก้ปัญหาได้เสมอ",
q:[["อีกาออกหาอะไร",["อาหาร","น้ำดื่ม","รังนก"],1],["ทำไมอีกาจึงดื่มน้ำในเหยือกไม่ได้",["น้ำสกปรก","เหยือกปิดฝา","น้ำมีน้อยจนปากเอื้อมไม่ถึง"],2],["อีกาแก้ปัญหาด้วยวิธีใด",["หย่อนก้อนกรวดลงในเหยือก","ทุบเหยือกให้แตก","ไปหาเพื่อนมาช่วย"],0],["เรื่องนี้สอนให้รู้ว่าอะไร",["ควรรอให้ฝนตก","ปัญญากับความพยายามแก้ปัญหาได้","ควรเลิกเมื่อเจอปัญหา"],1]]},
{t:"มดกับตั๊กแตน",x:"ตลอดฤดูร้อน มดงานตัวน้อยต่างขยันเก็บอาหารมาสะสมไว้ในรัง ส่วนตั๊กแตนตัวหนึ่งไม่ทำอะไรเลย มันได้แต่นั่งร้องเพลงและกระโดดเล่นอยู่ใต้แสงแดด เมื่อเห็นมดแบกอาหารผ่านไป ตั๊กแตนก็หัวเราะแล้วพูดว่า ทำไมพวกเจ้าต้องเหนื่อยขนาดนี้ มาร้องเพลงกับข้าดีกว่า มดตอบว่า เรากำลังเตรียมอาหารไว้กินในฤดูหนาว เจ้าก็ควรทำเช่นเดียวกัน ตั๊กแตนไม่สนใจ และใช้เวลาไปกับการเล่นสนุกทุกวัน เมื่อฤดูหนาวมาถึง อากาศหนาวเย็นและหิมะปกคลุมทุกที่ ตั๊กแตนหาอาหารไม่ได้เลย มันหิวจนตัวสั่น จึงเดินไปที่รังมดและขออาหารกิน มดถามว่า ตอนฤดูร้อนเจ้าทำอะไรอยู่ ตั๊กแตนตอบด้วยความอายว่า ข้าเอาแต่ร้องเพลง มดจึงแบ่งอาหารให้เล็กน้อย พร้อมเตือนว่า จงรู้จักเตรียมตัวก่อนที่จะสายเกินไป",

{t:"เด็กเลี้ยงแกะ",x:"ในหมู่บ้านเล็กๆ แห่งหนึ่ง มีเด็กหนุ่มคนหนึ่งทำหน้าที่เลี้ยงแกะอยู่บนเนินเขา เขารู้สึกเบื่อหน่ายเพราะไม่มีใครคุยด้วย วันหนึ่งเขาคิดจะแกล้งชาวบ้านเล่น จึงตะโกนเสียงดังว่า หมาป่ามาแล้ว ช่วยด้วย ชาวบ้านต่างวิ่งขึ้นเนินมาพร้อมไม้และจอบ แต่ไม่พบหมาป่าเลย เด็กหนุ่มหัวเราะชอบใจ ชาวบ้านจึงเดินกลับด้วยความโกรธ ไม่กี่วันต่อมา เขาก็แกล้งตะโกนอีกครั้ง ชาวบ้านก็หลงเชื่อและวิ่งมาอีกเป็นครั้งที่สอง จนกระทั่งวันหนึ่ง หมาป่าตัวใหญ่มาจริงๆ เด็กหนุ่มตกใจมากและร้องขอความช่วยเหลืออย่างสุดเสียง แต่ชาวบ้านคิดว่าเขาโกหกอีกแล้ว จึงไม่มีใครมา หมาป่ากัดแกะไปเสียหลายตัว เด็กหนุ่มนั่งร้องไห้เสียใจ และเข้าใจว่าคนที่พูดโกหกบ่อยๆ แม้พูดความจริงก็ไม่มีใครเชื่อ",

{t:"ห่านทองคำ",x:"ชายยากจนคนหนึ่งเลี้ยงห่านไว้ตัวหนึ่ง วันหนึ่งเขาพบว่าห่านออกไข่เป็นทองคำแท้ เขาดีใจมากรีบนำไข่ไปขายและได้เงินจำนวนมาก ตั้งแต่นั้นมา ห่านก็ออกไข่ทองคำทุกวัน ชายคนนั้นจึงร่ำรวยขึ้นเรื่อยๆ แต่เมื่อมีเงินมากแล้ว เขากลับเกิดความโลภ เขาคิดว่าการรอไข่วันละฟองนั้นช้าเกินไป ในท้องของห่านต้องมีทองคำก้อนใหญ่อยู่แน่นอน ถ้าผ่าท้องห่าน เขาจะได้ทองคำทั้งหมดในคราวเดียว เมื่อคิดได้เช่นนั้น เขาจึงจับห่านมาและใช้มีดผ่าท้อง แต่ในท้องของห่านกลับไม่มีทองคำเลยแม้แต่น้อย มีเพียงอวัยวะธรรมดาเหมือนห่านทั่วไป ห่านตายลง ชายคนนั้นเสียใจมาก เพราะไม่มีไข่ทองคำให้เก็บอีกต่อไป เขาเสียทั้งห่านและโอกาสที่จะร่ำรวย เพียงเพราะความโลภของตนเอง",

{t:"ลมกับดวงอาทิตย์",x:"วันหนึ่งลมและดวงอาทิตย์เถียงกันว่าใครเก่งกว่ากัน ขณะนั้นมีชายคนหนึ่งสวมเสื้อคลุมตัวหนาเดินผ่านมา ดวงอาทิตย์จึงเสนอว่า ใครทำให้ชายคนนั้นถอดเสื้อคลุมได้ก่อน คนนั้นคือผู้ชนะ ลมรับคำท้าและเริ่มพัดอย่างแรง ยิ่งลมพัดแรงเท่าไร ชายคนนั้นก็ยิ่งดึงเสื้อคลุมมาห่อตัวแน่นขึ้นเท่านั้น ลมพยายามจนเหนื่อยแต่ก็ไม่สำเร็จ จึงยอมแพ้ ต่อมาถึงตาของดวงอาทิตย์ ดวงอาทิตย์ส่องแสงอ่อนๆ อย่างอบอุ่น ชายคนนั้นรู้สึกร้อนขึ้นทีละน้อย เขาจึงคลายเสื้อคลุมออก และในที่สุดก็ถอดเสื้อคลุมออกจนหมด ลมจึงต้องยอมรับว่าดวงอาทิตย์เก่งกว่า เรื่องนี้สอนให้เรารู้ว่าความอ่อนโยนและความนุ่มนวลมักได้ผลดีกว่าการใช้กำลังและความรุนแรง",
q:[["ใครเป็นผู้ท้าแข่งกัน",["ลมกับดวงอาทิตย์","ลมกับฝน","ดวงอาทิตย์กับดวงจันทร์"],0],["ผู้ชนะต้องทำให้ชายคนนั้นทำอะไร",["วิ่งเร็วขึ้น","ถอดเสื้อคลุม","หยุดเดิน"],1],["เมื่อลมพัดแรง ชายคนนั้นทำอย่างไร",["ถอดเสื้อ","วิ่งหนี","ดึงเสื้อคลุมห่อตัวแน่นขึ้น"],2],["เรื่องนี้สอนให้รู้ว่าอะไร",["ควรใช้กำลังเสมอ","ความอ่อนโยนได้ผลดีกว่าความรุนแรง","ลมแรงกว่าแสงแดด"],1]]},
{t:"หมาจิ้งจอกกับพวงองุ่น",x:"ในวันที่อากาศร้อนจัด หมาจิ้งจอกตัวหนึ่งเดินหาอาหารมาตลอดทั้งวัน มันหิวและกระหายน้ำมาก ทันใดนั้นมันเห็นพวงองุ่นสุกสีม่วงห้อยอยู่บนต้นสูง องุ่นดูอวบอิ่มและน่ากินเหลือเกิน หมาจิ้งจอกน้ำลายสอ จึงกระโดดขึ้นไปหมายจะงับให้ได้ แต่พวงองุ่นอยู่สูงเกินไป มันกระโดดครั้งแล้วครั้งเล่าก็ยังเอื้อมไม่ถึง มันลองวิ่งเข้าใส่และกระโดดสุดแรง แต่ผลก็เหมือนเดิม จนในที่สุดมันก็หมดแรง นั่งลงหอบอยู่ใต้ต้นองุ่น มันมองพวงองุ่นอย่างไม่พอใจ แล้วพูดกับตัวเองว่า องุ่นพวกนั้นคงเปรี้ยวมาก ไม่น่ากินหรอก แล้วมันก็เดินจากไปอย่างหยิ่งทะนง เรื่องนี้สอนว่า คนที่ทำไม่สำเร็จมักหาข้อแก้ตัวให้ตนเอง แทนที่จะยอมรับความจริง",
q:[["หมาจิ้งจอกเห็นอะไรบนต้นสูง",["ผลแอปเปิล","รังผึ้ง","พวงองุ่นสุก"],2],["หมาจิ้งจอกพยายามทำอย่างไร",["กระโดดขึ้นไปงับ","ปีนต้นไม้","เรียกเพื่อนมาช่วย"],0],["เมื่อเอื้อมไม่ถึง หมาจิ้งจอกพูดว่าอย่างไร",["องุ่นสุกแล้ว","องุ่นคงเปรี้ยว ไม่น่ากิน","พรุ่งนี้จะมาใหม่"],1],["เรื่องนี้สอนให้รู้ว่าอะไร",["ควรกินองุ่นเสมอ","ควรกระโดดให้สูง","คนมักหาข้อแก้ตัวเมื่อทำไม่สำเร็จ"],2]]},
{t:"หมากับเงาในน้ำ",x:"หมาตัวหนึ่งขโมยเนื้อชิ้นโตมาจากร้านขายเนื้อได้สำเร็จ มันคาบเนื้อไว้ในปากแล้ววิ่งหนีออกมาอย่างดีใจ เพื่อหาที่เงียบๆ นั่งกินอย่างสบายใจ ระหว่างทางมันต้องเดินข้ามสะพานไม้เล็กๆ ที่พาดอยู่เหนือลำธาร ขณะเดินอยู่ มันก้มลงมองไปในน้ำใส และเห็นหมาอีกตัวหนึ่งคาบเนื้อชิ้นใหญ่ไม่แพ้กันอยู่ในน้ำ หมาตัวนั้นคิดว่าเนื้อของอีกตัวดูใหญ่กว่าของตน มันเกิดความโลภและอยากได้ทั้งสองชิ้น จึงเห่าใส่หมาในน้ำอย่างดุร้าย ทันใดนั้นเนื้อในปากของมันก็หลุดตกลงไปในลำธาร ไหลหายไปกับสายน้ำทันที หมาตัวนั้นจึงรู้ว่าที่เห็นเป็นเพียงเงาของตนเอง มันยืนมองน้ำอย่างเสียใจ เพราะความโลภทำให้ต้องเสียของที่มีอยู่ไปจนหมดสิ้น และต้องกลับไปอย่างหิวโหย",
q:[["หมาขโมยอะไรมาจากร้าน",["ปลา","เนื้อชิ้นโต","ขนมปัง"],1],["หมาเดินข้ามอะไร",["สะพานไม้เล็กๆ","ทางรถไฟ","กำแพง"],0],["เมื่อหมาเห่าใส่เงาในน้ำ เกิดอะไรขึ้น",["เนื้อหลุดตกลงไปในลำธาร","หมาในน้ำหนีไป","ได้เนื้อเพิ่ม"],0],["เรื่องนี้สอนให้รู้ว่าอะไร",["ความโลภทำให้เสียของที่มีอยู่","ควรเห่าให้ดัง","ไม่ควรเดินข้ามสะพาน"],0]]},
{t:"มัดไม้ของชาวนา",x:"ชาวนาคนหนึ่งมีลูกชายสามคนที่ชอบทะเลาะกันอยู่เสมอ ไม่ว่าจะเป็นเรื่องใหญ่หรือเรื่องเล็ก พ่อรู้สึกเสียใจและกังวลมากว่าเมื่อตนจากโลกนี้ไป ลูกๆ จะอยู่กันไม่ได้ วันหนึ่งพ่อจึงเรียกลูกทั้งสามมาพบ และสั่งให้นำไม้เรียวมาหนึ่งมัดซึ่งผูกรวมกันไว้แน่นหนา พ่อบอกว่า ใครหักมัดไม้นี้ได้ ข้าจะให้รางวัล ลูกคนโตลองหัก แต่ก็ไม่สามารถทำได้ ลูกคนรองและคนเล็กลองใช้แรงทั้งหมดก็ยังหักไม่ได้เช่นกัน พ่อจึงแก้มัดไม้ออก แล้วส่งไม้ทีละอันให้ลูกแต่ละคน ครั้งนี้ลูกๆ หักไม้ได้อย่างง่ายดาย พ่อจึงบอกว่า ถ้าพวกเจ้าสามัคคีกัน ก็จะแข็งแรงเหมือนมัดไม้ แต่ถ้าแตกแยกกัน ใครก็ทำลายพวกเจ้าได้ง่ายเหมือนไม้เส้นเดียว ลูกทั้งสามจึงสำนึกและรักกันนับแต่นั้น",
q:[["ลูกชายของชาวนามีนิสัยอย่างไร",["ชอบทะเลาะกัน","เกียจคร้าน","ชอบโกหก"],0],["พ่อให้ลูกหักอะไร",["กิ่งไม้ใหญ่","มัดไม้เรียวที่ผูกรวมกัน","เหล็ก"],1],["เมื่อแยกไม้ออกเป็นทีละอัน เกิดอะไรขึ้น",["ลูกๆ หักได้ง่าย","ยังหักไม่ได้","ไม้หายไป"],0],["เรื่องนี้สอนให้รู้ว่าอะไร",["พ่อแม่ควรดุลูก","ไม้ที่แข็งแรงหักยาก","ความสามัคคีทำให้เข้มแข็ง"],2]]},
{t:"หนูเมืองกับหนูบ้านนอก",x:"หนูบ้านนอกตัวหนึ่งอาศัยอยู่ในทุ่งนา กินแต่ข้าวและถั่วธรรมดาอย่างเรียบง่าย วันหนึ่งหนูเมืองซึ่งเป็นเพื่อนเก่ามาเยี่ยม และชวนให้ไปอยู่ในเมืองว่า ที่นั่นมีอาหารอร่อยมากมาย หนูบ้านนอกจึงไปด้วยความตื่นเต้น เมื่อถึงบ้านหลังใหญ่ในเมือง ก็พบว่าบนโต๊ะมีขนมปัง เนยแข็ง และผลไม้สดวางเต็มไปหมด ทั้งสองเริ่มกินอย่างเอร็ดอร่อย แต่แล้วประตูก็เปิดออก เจ้าของบ้านเดินเข้ามาพร้อมแมวตัวใหญ่ หนูทั้งสองตกใจรีบวิ่งหนีเข้ารู หัวใจเต้นแรงด้วยความกลัว เมื่อกลับมากินอีกครั้ง ก็มีเสียงสุนัขเห่าดังลั่น ต้องวิ่งหนีอีก หนูบ้านนอกจึงบอกลาเพื่อนว่า ข้าขอกลับไปกินข้าวธรรมดาในทุ่งนา ดีกว่าอยู่อย่างหวาดกลัวท่ามกลางอาหารหรูหรา เพราะความสงบสุขมีค่ากว่าความร่ำรวย",

{t:"กระดิ่งของแมว",x:"หนูกลุ่มหนึ่งอาศัยอยู่ในบ้านหลังเก่า แต่ต้องอยู่อย่างหวาดกลัวทุกวัน เพราะมีแมวตัวหนึ่งคอยซุ่มจับพวกมันกิน ทุกครั้งที่ออกไปหาอาหาร ก็จะมีหนูหายไปหนึ่งตัวเสมอ หนูทั้งหมดจึงประชุมกันเพื่อหาวิธีแก้ปัญหา หนูหนุ่มตัวหนึ่งลุกขึ้นพูดว่า ถ้าเราผูกกระดิ่งไว้ที่คอแมว เราก็จะได้ยินเสียงเมื่อมันเข้ามาใกล้ และหนีไปได้ทัน หนูทุกตัวต่างปรบมือชอบใจ คิดว่าเป็นความคิดที่ยอดเยี่ยมมาก แต่แล้วหนูแก่ตัวหนึ่งที่นั่งเงียบมานานก็ลุกขึ้นถามว่า แล้วใครจะเป็นคนไปผูกกระดิ่งที่คอแมวล่ะ ทันใดนั้นทุกตัวก็เงียบกริบ ไม่มีใครกล้าอาสา เพราะรู้ว่าอันตรายเกินไป การประชุมจึงจบลงโดยไม่ได้ข้อสรุป หนูแก่จึงสอนว่า การคิดแผนที่ดูดีนั้นง่าย แต่การลงมือทำให้ได้จริงนั้นยากกว่ามาก",

{t:"คนตัดไม้กับขวานทองคำ",x:"คนตัดไม้ยากจนคนหนึ่งตัดฟืนอยู่ริมแม่น้ำ ขณะทำงานเขาพลาดทำขวานเหล็กเล่มเดียวที่มีตกลงไปในน้ำลึก เขานั่งร้องไห้เสียใจเพราะไม่มีเงินซื้อขวานใหม่ ทันใดนั้นเทวดาองค์หนึ่งปรากฏตัวขึ้น และถามว่าเกิดอะไรขึ้น เมื่อรู้เรื่อง เทวดาจึงดำลงไปในน้ำ แล้วนำขวานทองคำขึ้นมาถามว่า นี่คือขวานของเจ้าใช่ไหม คนตัดไม้ส่ายหน้าและตอบว่า ไม่ใช่ขอรับ เทวดาดำลงไปอีกครั้งแล้วนำขวานเงินขึ้นมา คนตัดไม้ก็ตอบว่าไม่ใช่เช่นเดิม ครั้งที่สามเทวดานำขวานเหล็กเก่าๆ ขึ้นมา เขาดีใจมากและตอบว่า ใช่แล้วขอรับ นั่นคือขวานของข้า เทวดาประทับใจในความซื่อสัตย์ จึงมอบขวานทองคำและขวานเงินให้เป็นรางวัลด้วย เขากลับบ้านด้วยความสุข เพราะความซื่อสัตย์นำโชคดีมาให้",
q:[["ขวานของคนตัดไม้ตกลงไปที่ใด",["ในบ่อ","ในแม่น้ำ","ในป่า"],1],["ขวานเล่มแรกที่เทวดานำขึ้นมาเป็นอะไร",["ขวานทองคำ","ขวานเงิน","ขวานเหล็ก"],0],["เทวดามอบรางวัลเพราะเหตุใด",["คนตัดไม้ขอ","คนตัดไม้ซื่อสัตย์","คนตัดไม้ร้องไห้"],1],["เรื่องนี้สอนให้รู้ว่าอะไร",["ควรตัดฟืนมากๆ","ควรขอรางวัล","ความซื่อสัตย์นำโชคดีมาให้"],2]]},
{t:"จิ้งจอกกับนกกระเรียน",x:"หมาจิ้งจอกตัวหนึ่งเชิญนกกระเรียนมากินอาหารเย็นที่บ้าน แต่ในใจคิดจะแกล้งเพื่อนเล่น มันตักซุปใส่จานแบนๆ วางไว้ตรงหน้านกกระเรียน แล้วตนเองก็ใช้ลิ้นเลียซุปกินอย่างเอร็ดอร่อย ส่วนนกกระเรียนมีจะงอยปากยาว จึงจิกซุปจากจานแบนไม่ได้เลย ต้องนั่งหิวอยู่อย่างนั้นจนหมดมื้อ หมาจิ้งจอกแกล้งถามว่า ซุปไม่ถูกปากหรือ นกกระเรียนไม่โกรธ เพียงตอบอย่างสุภาพ และเชิญหมาจิ้งจอกมากินอาหารที่บ้านบ้างในวันรุ่งขึ้น เมื่อถึงเวลา นกกระเรียนตักอาหารใส่ในขวดคอยาว แล้ววางไว้ตรงหน้าแขก นกกระเรียนใช้จะงอยปากยาวจิกอาหารกินได้อย่างสบาย แต่หมาจิ้งจอกสอดปากเข้าไปไม่ได้ ได้แต่เลียอาหารที่ติดปากขวดเท่านั้น มันอายมากและรู้ว่าตนสมควรได้รับเช่นนี้ เพราะเมื่อเราทำไม่ดีกับผู้อื่น ก็ย่อมได้รับสิ่งที่ไม่ดีตอบกลับมา",
q:[["หมาจิ้งจอกใส่ซุปในภาชนะอะไรให้นกกระเรียน",["ขวดคอยาว","จานแบน","ชามลึก"],1],["ทำไมนกกระเรียนกินซุปไม่ได้",["ซุปร้อนเกินไป","ไม่หิว","จะงอยปากยาวจิกจานแบนไม่ได้"],2],["วันรุ่งขึ้นนกกระเรียนใส่อาหารในอะไร",["ขวดคอยาว","จานแบน","กระดาษ"],0],["เรื่องนี้สอนให้รู้ว่าอะไร",["ควรเชิญเพื่อนกินข้าว","ทำไม่ดีกับผู้อื่นก็ได้รับสิ่งไม่ดีตอบ","จะงอยปากยาวมีประโยชน์"],1]]},
{t:"กากับขนนกยูง",x:"กาตัวหนึ่งรู้สึกอิจฉานกยูงที่มีขนหางสวยงามและเป็นที่ชื่นชมของทุกตัวในป่า มันคิดว่าตนเองตัวดำน่าเกลียดและไม่มีใครอยากมอง วันหนึ่งมันเห็นขนนกยูงหลายเส้นร่วงอยู่บนพื้น จึงเก็บมาเสียบไว้ที่หางของตนเอง แล้วเดินวางท่าไปมาอย่างภูมิใจ เมื่อพบฝูงนกยูง มันก็ขอเข้าร่วมกลุ่มโดยแกล้งทำเป็นนกยูงด้วยกัน แต่นกยูงจับได้ทันทีว่ากาตัวนี้เป็นของปลอม จึงช่วยกันจิกขนปลอมออกจนหมด และไล่มันออกไปจากฝูง กาตัวนั้นเสียใจมากจึงกลับไปหาฝูงกาเดิมของตน แต่พวกกาก็ไม่ยอมรับ เพราะมันเคยดูถูกและทิ้งพวกพ้องไป กาจึงอยู่อย่างโดดเดี่ยว และเข้าใจในที่สุดว่า การเป็นตัวของตัวเองดีที่สุด การแต่งตัวเลียนแบบผู้อื่นไม่ทำให้ใครรักเรามากขึ้น",

{t:"กบกับวัว",x:"กบตัวเล็กตัวหนึ่งนั่งอยู่ริมบึง เมื่อเห็นวัวตัวใหญ่เดินมากินน้ำ มันตกใจที่วัวมีร่างกายใหญ่โตมาก จึงรีบกลับไปบอกแม่ว่า วันนี้ข้าเห็นสัตว์ตัวใหญ่ที่สุดในโลก แม่กบถามว่าใหญ่เท่าข้าหรือไม่ แล้วก็พองตัวให้ใหญ่ขึ้น ลูกกบตอบว่า ใหญ่กว่านี้มากครับแม่ แม่กบจึงพองตัวมากขึ้นอีก แต่ลูกก็ยังบอกว่าวัวใหญ่กว่านั้นอีก แม่กบไม่ยอมแพ้ มันสูดลมหายใจเข้าและพองตัวจนสุดแรง เพราะอยากเป็นสัตว์ที่ใหญ่ที่สุด ลูกกบร้องเตือนว่า พอแล้วครับแม่ เดี๋ยวท้องจะแตก แต่แม่กบไม่ฟัง ยังคงพองตัวต่อไปเรื่อยๆ จนในที่สุดท้องก็แตกดังโพละ และล้มลงตายในทันที เรื่องนี้สอนว่า ความอยากเด่นอยากดังเกินตัวนำไปสู่หายนะ",

{t:"ลากับหนังสิงโต",x:"ลาตัวหนึ่งพบหนังสิงโตวางอยู่ในป่า มันนึกสนุกจึงสวมหนังสิงโตไว้บนตัว แล้วเดินไปมาอย่างวางท่า สัตว์ทั้งหลายเห็นเข้าก็ตกใจกลัว ต่างวิ่งหนีกันไปอย่างไม่คิดชีวิต ลาดีใจมากที่ทุกตัวเกรงกลัวตน มันจึงยิ่งทำท่าองอาจ และเดินเข้าไปในหมู่บ้านเพื่อแกล้งผู้คน ชาวบ้านที่พบเห็นก็ตกใจวิ่งหนีกันหมด ลาคิดว่าตนเองเก่งกล้าเหมือนสิงโตจริงๆ จึงเกิดความหยิ่งผยองขึ้นมา แต่แล้วมันก็เผลอส่งเสียงร้องออกมาว่า ฮี้ ฮี้ ซึ่งเป็นเสียงของลาที่ใครๆ ก็รู้จัก สุนัขจิ้งจอกที่ได้ยินจึงหัวเราะแล้วพูดว่า ข้าคงกลัวเจ้าไปแล้ว หากไม่ได้ยินเสียงร้อง ชาวบ้านจึงจับลาได้ และถอดหนังสิงโตออก เรื่องนี้สอนว่า คนที่แสร้งทำเป็นผู้อื่น แม้แต่งกายดีเพียงใด เมื่อเปิดปากพูดก็รู้ความจริงทันที",
